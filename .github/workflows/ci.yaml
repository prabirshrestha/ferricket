name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v0.[0-9]+.[0-9]+'
      - 'v0.[0-9]+.[0-9]+-beta.[0-9]+'
      - 'v0.[0-9]+.[0-9]+-alpha.[0-9]+'

jobs:
  build_and_test:
    name: Build and Test
    permissions:
      contents: read
      id-token: write
    env:
      # emit backtraces on panics.
      RUST_BACKTRACE: 1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install tools
        uses: jdx/mise-action@v3

      - name: Build
        run: make build

      - name: Check
        run: make check

      - name: Check embedded frontend assets
        run: git diff --exit-code -- web/dist

      - name: Authenticate with crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@v1
        if: startsWith(github.ref, 'refs/tags/')

      - name: Publish to crates.io
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: make publish
